{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>

<header>
    <h1>GameDealFinder</h1>
    <a href="{% url 'gameList' %}">К списку игр</a>
</header>

<div class="container">
    <div class="card">
        <h2>Вход</h2>

        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}

            <p>
                {{ form.username.label_tag }}<br>
                {{ form.username }}
                {{ form.username.errors }}
            </p>

            <p>
                {{ form.password.label_tag }}<br>
                {{ form.password }}
                {{ form.password.errors }}
            </p>

            <button type="submit">Войти</button>
        </form>

        <a href="{% url 'register' %}">Нет аккаунта? Зарегистрироваться</a>
    </div>
</div>

</body>
</html>
