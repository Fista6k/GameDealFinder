{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Профиль</title>
    <link rel="stylesheet" href="{% static 'css/profile.css' %}">
</head>
<body>

<header>
    <h1>GameDealFinder</h1>
    <a href="{% url 'gameList' %}">К списку игр</a>
</header>

<div class="container">
    <div class="card">
        <h1 class="card-title">Профиль</h1>

        <p><strong>Email:</strong> {{ request.user.email }}</p>
        <p><strong>Имя пользователя:</strong> {{ request.user.username }}</p>

        <a class="card-link" href="{% url 'waitlist' %}">Мой вейтлист</a><br>
        <a class="card-link" href="{% url 'logout' %}">Выйти</a>
    </div>
</div>

</body>
</html>
