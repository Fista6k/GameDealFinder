<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Профиль</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 40px;
        }
        .card {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        a {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Профиль</h1>

    <p><strong>Email:</strong> {{ request.user.email }}</p>
    <p><strong>Имя пользователя:</strong> {{ request.user.username }}</p>

    <a href="{% url 'waitlist' %}">Мой вейтлист</a><br>
    <a href="{% url 'logout' %}">Выйти</a><br>
    <a href="{% url 'gameList' %}">К списку игр</a>
</div>

</body>
</html>
